<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0d172e">
  <title>三分 — 你的解籤日記</title>

  <!-- Google Fonts for Chinese Display Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@700;900&family=Noto+Serif+TC:wght@700;900&family=ZCOOL+QingKe+HuangYou&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">

  <!-- Three.js + GLTFLoader (Modern ES Modules & Import Map for r160) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    @font-face {
      font-family: 'Suisse Fallback';
      src: local('Inter Medium'), local('Inter-Medium');
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: 'Suisse Fallback';
      src: local('Inter SemiBold'), local('Inter-SemiBold');
      font-weight: 600;
      font-display: swap;
    }

    :root {
      --desktop-scale: 1;
      --header-scale: 1;
      --brand-edge-margin: 45px;
      --social-edge-margin: 38.6204px;
      --design-width: 1726;
      --design-height: 1195;
      --tablet-layout: 0;
      --mobile-layout: 0;
      --hero-background-crop: 0.115;
      --final-background-crop: 0.303;
      --sky-blue: #0d172e;
      --section-cookie-radius: 266px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 320vh;
      background: #0d172e;
      color: #ffffff;
      font-family: 'Suisse Fallback', 'Inter', Arial, sans-serif;
      overflow-x: hidden;
      overscroll-behavior: none;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar, body::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .experience {
      position: relative;
      width: 100%;
      height: 320vh;
      pointer-events: none;
    }

    /* Fixed Viewport Container */
    .viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      pointer-events: auto;
    }

    /* Background Scene */
    .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .scene .landscape {
      position: absolute;
      top: 0;
      left: 50%;
      width: 105vw;
      height: auto;
      min-height: 140vh;
      transform: translate3d(-50%, 0, 0);
      object-fit: cover;
      will-change: transform;
      pointer-events: none;
      transition: filter 0.5s ease;
    }

    @media (max-width: 1060px) and (max-aspect-ratio: 49/64) {
      .scene .landscape {
        height: 145dvh;
        width: auto;
        min-width: 105vw;
        object-fit: cover;
      }
    }

    .scene-vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(6, 40, 52, 0.035), transparent 32%, rgba(18, 25, 9, 0.025));
      pointer-events: none;
      z-index: 2;
    }

    /* Ambient dynamic glow overlay */
    .ambient-glow {
      position: absolute;
      top: 20%;
      left: 50%;
      width: 600px;
      height: 600px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(74, 129, 146, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
    }

    /* Stage Canvas System (1726 x 1195) */
    .stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1726px;
      height: 1195px;
      transform: translate(-50%, -50%) scale(var(--desktop-scale));
      transform-origin: center center;
      z-index: 3;
      opacity: 0;
      transition: opacity 300ms ease-out;
      pointer-events: none;
    }

    .stage.is-ready {
      opacity: 1;
    }

    #cookie-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* Header Nav */
    .scene-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 0;
      z-index: 10;
      opacity: 0;
      transition: opacity 300ms ease-out;
      pointer-events: auto;
    }

    .scene-nav.is-ready {
      opacity: 1;
    }

    .brand-link {
      position: absolute;
      top: 36px;
      left: var(--brand-edge-margin);
      width: 167px;
      height: 35.2px;
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #ffffff;
      transform-origin: top left;
      transform: scale(var(--header-scale));
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .brand-link:hover {
      transform: scale(calc(var(--header-scale) * 1.05));
    }

    .brand-svg {
      width: 100%;
      height: 100%;
    }

    .center-nav {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%) scale(var(--header-scale));
      transform-origin: top center;
      display: flex;
      align-items: center;
      gap: 7px;
      height: 47px;
    }

    .nav-pill {
      height: 47px;
      border-radius: 14px;
      padding: 0 18px;
      font-size: 13.3846px;
      font-weight: 500;
      letter-spacing: -0.02em;
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(10.7px);
      -webkit-backdrop-filter: blur(10.7px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.25s ease, box-shadow 0.25s ease;
    }

    .nav-pill:hover {
      background: rgba(0, 0, 0, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    .nav-pill.shop-pill {
      background: #0b0b0b;
      width: 92.7932px;
      gap: 10px;
      justify-content: flex-start;
      padding-left: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .nav-pill.shop-pill:hover {
      background: #1f1f1f;
    }

    .nav-pill.cookies-pill { width: 86px; }
    .nav-pill.about-pill { width: 92px; }
    .nav-pill.ingredients-pill { width: 104px; }

    .right-cluster {
      position: absolute;
      top: 30px;
      right: var(--social-edge-margin);
      transform: scale(var(--header-scale));
      transform-origin: top right;
      display: flex;
      align-items: center;
      gap: 7px;
      height: 47px;
    }

    .social-tray {
      width: 138.3796px;
      height: 47px;
      border-radius: 14px;
      background: rgba(11, 11, 11, 0.12);
      backdrop-filter: blur(15.7px);
      -webkit-backdrop-filter: blur(15.7px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .social-link {
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
      transition: opacity 0.2s, transform 0.2s;
      text-decoration: none;
    }

    .social-link:hover {
      opacity: 1;
      transform: scale(1.2);
    }

    .cart-btn {
      width: 47px;
      height: 47px;
      border-radius: 14px;
      background: #0b0b0b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      transition: background 0.2s, transform 0.2s;
    }

    .cart-btn:hover {
      background: #222222;
      transform: translateY(-2px) scale(1.04);
    }

    /* Floating Interactive Controls */
    .action-hud {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
      pointer-events: auto;
    }

    .hud-btn {
      height: 42px;
      padding: 0 18px;
      border-radius: 21px;
      background: rgba(11, 11, 11, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.25s ease;
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      color: #0b0b0b;
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
    }

    .scroll-hint {
      animation: bounceHint 2s infinite ease-in-out;
    }

    @keyframes bounceHint {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
      60% { transform: translateY(-3px); }
    }

    /* Mobile / Tablet Hamburger */
    .hamburger-btn {
      display: none;
      position: absolute;
      top: 25px;
      right: 20px;
      width: 47px;
      height: 47px;
      border-radius: 14px;
      background: #0b0b0b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      z-index: 100;
    }

    .hamburger-line {
      width: 17px;
      height: 2px;
      background: #ffffff;
      border-radius: 1px;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .hamburger-btn.is-active .line-1 { transform: translateY(6px) rotate(45deg); }
    .hamburger-btn.is-active .line-2 { opacity: 0; }
    .hamburger-btn.is-active .line-3 { transform: translateY(-6px) rotate(-45deg); }

    .mobile-menu-panel {
      position: fixed;
      top: 80px;
      right: 20px;
      width: min(360px, calc(100vw - 40px));
      border-radius: 24px;
      background: rgba(22, 59, 70, 0.75);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 18px 60px rgba(7, 24, 30, 0.35);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
      transition: opacity 200ms ease, transform 200ms ease;
      z-index: 99;
    }

    .mobile-menu-panel.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .mobile-pills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mobile-bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    /* Titles */
    .title-container {
      position: absolute;
      white-space: nowrap;
      perspective: 800px;
      pointer-events: none;
    }

    .brand-text {
      position: absolute;
      top: 36px;
      left: var(--brand-edge-margin);
      font-family: 'Noto Serif TC', 'Songti TC', serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.35em;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      transform: scale(var(--header-scale));
      transform-origin: top left;
      pointer-events: none;
      white-space: nowrap;
    }

    .hero-title {
      top: 130px;
      left: 50%;
      transform: translateX(-50%);
      width: 1480px;
      height: 320px;
      font-family: 'Noto Serif TC', 'Songti TC', 'STSong', 'SimSun', serif;
      font-weight: 900;
      font-size: 260px;
      line-height: 0.9;
      letter-spacing: 0.05em;
      text-indent: 0.05em;
      text-align: center;
      z-index: 4;
      text-shadow: 0 20px 70px rgba(0, 0, 0, 0.8), 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .diff-title {
      top: 1020px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 140px;
      font-family: 'Noto Serif TC', 'Songti TC', 'STSong', 'SimSun', serif;
      font-weight: 900;
      font-size: 118px;
      line-height: 0.95;
      letter-spacing: 0.06em;
      text-indent: 0.06em;
      text-align: center;
      z-index: 4;
      cursor: pointer;
      text-shadow: 0 20px 70px rgba(0, 0, 0, 0.95), 0 4px 20px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.3s ease;
    }
    .diff-title:hover {
      filter: drop-shadow(0 0 25px rgba(255, 210, 230, 0.9));
      transform: translateX(-50%) scale(1.03);
    }

    #cookie-canvas {
      cursor: pointer;
    }

    .nav-enter-btn {
      position: absolute;
      top: 36px;
      right: 50px;
      z-index: 100;
      padding: 10px 22px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      font-family: 'Noto Serif TC', serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.1em;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .nav-enter-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 12px 35px rgba(255, 182, 193, 0.4);
      border-color: rgba(255, 255, 255, 0.6);
    }
    .nav-enter-btn:active {
      transform: scale(0.97);
    }

    .split-char {
      display: inline-block;
      transform-origin: 50% 70%;
      will-change: transform, opacity;
      transition: color 0.3s ease;
    }

    /* Responsive Media Queries */
    @media (max-width: 1060px) {
      :root {
        --tablet-layout: 1;
      }
      .hero-title {
        font-size: 240px;
        top: 120px;
        left: 50% !important;
        transform: translateX(-50%);
        width: 1200px;
        letter-spacing: 0.05em;
        text-indent: 0.05em;
      }
    }

    @media (max-width: 620px) {
      :root {
        --mobile-layout: 1;
      }
      .brand-text {
        top: 22px;
        left: 20px;
        font-size: 13px;
        letter-spacing: 0.25em;
      }
      .hero-title {
        left: 50% !important;
        transform: translateX(-50%);
        width: 100vw !important;
        font-size: 110px !important;
        letter-spacing: 0.05em !important;
        text-indent: 0.05em !important;
      }
      .diff-title {
        left: 50% !important;
        transform: translateX(-50%);
        width: 90% !important;
        font-size: 52px !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Scroll container of 320vh -->
  <main class="experience">
    <div class="viewport">
      <!-- 1. Background scene & parallax -->
      <div class="scene">
        <img class="landscape" id="landscape-img" src="https://cdn.jsdelivr.net/gh/jnyang6270-art/moon@main/background.jpg" alt="Starry Sky Sea Landscape">
        <div class="scene-vignette"></div>
        <div class="ambient-glow"></div>
      </div>

      <!-- 2. Header UI -->
      <nav class="scene-nav" id="scene-nav">
        <!-- Brand Text: 天時。地利。人和 -->
        <div class="brand-text">天時。地利。人和</div>
        <a href="diary.html" class="nav-enter-btn" title="進入籤詩日記系統">
          <span>進入籤詩日記 ➔</span>
        </a>
      </nav>

      <!-- 3. Stage Container (1726 x 1195) -->
      <div class="stage" id="stage">
        <!-- Three.js Canvas -->
        <canvas id="cookie-canvas"></canvas>

        <!-- Hero Title -->
        <h1 class="title-container hero-title" id="hero-title">三分</h1>

        <!-- Section 2 Title -->
        <h2 class="title-container diff-title" id="diff-title">你的解籤日記</h2>
      </div>



    </div>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // --- 1. Easing helpers ---
      function clamp(val, min = 0, max = 1) {
        return Math.max(min, Math.min(max, val));
      }
      function lerp(a, b, t) {
        return a + (b - a) * t;
      }
      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }
      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }
      function easeOutBack(t) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }

      // --- 2. DOM Split-text setup ---
      function splitTextToSpans(element) {
        const text = element.textContent.trim();
        element.innerHTML = '';
        const spans = [];
        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const span = document.createElement('span');
          span.className = 'split-char';
          if (char === ' ') {
            span.innerHTML = '&nbsp;';
          } else {
            span.textContent = char;
          }
          element.appendChild(span);
          spans.push(span);
        }
        return spans;
      }

      const heroTitleEl = document.getElementById('hero-title');
      const diffTitleEl = document.getElementById('diff-title');
      const heroSpans = splitTextToSpans(heroTitleEl);
      const diffSpans = splitTextToSpans(diffTitleEl);

      // --- 3. Stage & Layout calculations ---
      const stageEl = document.getElementById('stage');
      const sceneNavEl = document.getElementById('scene-nav');
      const landscapeImg = document.getElementById('landscape-img');

      let layoutState = {
        w: window.innerWidth,
        h: window.innerHeight,
        scale: 1,
        headerScale: 1,
        isTablet: false,
        isMobile: false,
        heroY: 0,
        sectionY: 0,
        heroScale: 1,
        sectionScale: 1,
        bgHeight: 1280
      };

      function updateLayout() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const isTablet = w <= 1060;
        const isMobile = w <= 620;

        let scale = isMobile ? Math.max(w / 1726, h / 1195) : Math.min(w / 1726, h / 1195);
        let headerScale = isTablet ? clamp(w / 900, 0.82, 1) : Math.min(1, w / 1726);

        document.documentElement.style.setProperty('--desktop-scale', scale);
        document.documentElement.style.setProperty('--header-scale', headerScale);

        // Calculate cookie positions in design stage coordinates
        const targetDiameter = 532; // base diameter
        let heroScale = 1;
        let sectionScale = 1;
        let heroY = 0;
        let sectionY = 0;

        if (isMobile) {
          const heroD = clamp(w * 0.72, 250, 310);
          const secD = clamp(w * 0.67, 235, 300);
          heroScale = heroD / targetDiameter;
          sectionScale = secD / targetDiameter;
          heroY = 50;
          sectionY = (h * 0.445 - h / 2) / scale;
        } else if (isTablet) {
          const heroD = clamp(w * 0.38, 260, 340);
          heroScale = heroD / targetDiameter;
          sectionScale = heroScale;
          heroY = 20;
          sectionY = 0;
        } else {
          // Desktop Corridor: between hero-title bottom (409) and "The Difference" top (937)
          const corridorCenter = (409 + 937) / 2; // 673
          heroY = 1195 / 2 - corridorCenter; // ~ -75.5 relative to stage center
          sectionY = 0;
          heroScale = 1;
          sectionScale = 1;
        }

        const secCookieRadius = (532 * sectionScale * 0.96) / 2;
        document.documentElement.style.setProperty('--section-cookie-radius', `${secCookieRadius}px`);

        layoutState = {
          w, h, scale, headerScale, isTablet, isMobile,
          heroY, sectionY, heroScale, sectionScale,
          bgHeight: landscapeImg.clientHeight || 1280
        };
      }

      window.addEventListener('resize', updateLayout);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateLayout);
      }
      updateLayout();

      // --- 4. Mouse Interactive Parallax Tracking ---
      let mouseX = 0;
      let mouseY = 0;
      let smoothMouseX = 0;
      let smoothMouseY = 0;

      window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
      });

      // --- 5. Three.js Setup ---
      const canvas = document.getElementById('cookie-canvas');
      const scene = new THREE.Scene();

      const camera = new THREE.OrthographicCamera(-863, 863, 597.5, -597.5, 0.1, 4000);
      camera.position.z = 2000;

      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(1726, 1195, false);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(0x000000, 0);

      // Lighting
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x704019, 0.9);
      scene.add(hemiLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 1.25);
      keyLight.position.set(-450, 650, 1200);
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0xffb56b, 0.45);
      rimLight.position.set(600, -100, 500);
      scene.add(rimLight);

      const fillLight = new THREE.DirectionalLight(0x73b0c2, 0.35);
      fillLight.position.set(0, -500, 800);
      scene.add(fillLight);

      // Groups
      const cookieGroup = new THREE.Group();
      const innerGroup = new THREE.Group();
      cookieGroup.add(innerGroup);
      scene.add(cookieGroup);

      // Loading indicator for original 3D Model
      const loadingHud = document.createElement('div');
      loadingHud.id = 'loading-hud';
      loadingHud.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;color:#fff;font-family:sans-serif;font-size:14px;background:rgba(0,0,0,0.7);padding:14px 28px;border-radius:24px;backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;gap:12px;pointer-events:none;transition:opacity 0.4s ease;';
      loadingHud.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" stroke="#ffffff" stroke-width="2.5" fill="none" style="animation:spinLoader 1s linear infinite"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10"/></svg><span id="load-status">正在載入原始 3D 月球...</span>';
      document.body.appendChild(loadingHud);

      const spinStyle = document.createElement('style');
      spinStyle.textContent = '@keyframes spinLoader { 100% { transform: rotate(360deg); } }';
      document.head.appendChild(spinStyle);

      let introStartTime = performance.now() + 100;

      // Async GLB model loader
      const loader = new GLTFLoader();

      function applyGltfModel(gltf) {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.sub(center);

        const maxDim = Math.max(size.x, size.y, size.z);
        const baseScale = 532 / (maxDim || 1);

        model.traverse((child) => {
          if (child.isMesh && child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach((mat) => {
              mat.metalness = 0;
              mat.roughness = Math.max(0.72, mat.roughness !== undefined ? mat.roughness : 0.8);
              if (mat.map) {
                mat.map.colorSpace = THREE.SRGBColorSpace;
                mat.map.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
                mat.map.needsUpdate = true;
              }
              mat.needsUpdate = true;
            });
          }
        });

        innerGroup.scale.set(baseScale, baseScale, baseScale);
        innerGroup.add(model);

        // Hide loading indicator & reveal stage
        loadingHud.style.opacity = '0';
        setTimeout(() => loadingHud.remove(), 400);
        introStartTime = performance.now();
        stageEl.classList.add('is-ready');
        sceneNavEl.classList.add('is-ready');
      }

      // Load original model
      loader.load(
        'Hi3D-moon.glb',
        applyGltfModel,
        function (xhr) {
          if (xhr.lengthComputable && xhr.total > 0) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            const statusEl = document.getElementById('load-status');
            if (statusEl) statusEl.textContent = `正在載入原始 3D 月球 (${pct}%)...`;
          }
        },
        function (err) {
          console.warn('Direct load failed, trying CDN fallback...', err);
          loader.load(
            'https://cdn.jsdelivr.net/gh/jnyang6270-art/moon@main/Hi3D-moon.glb',
            applyGltfModel
          );
        }
      );

      // --- 6. Scroll Tracking & Smooth Interpolation ---
      let targetScroll = 0;
      let smoothScroll = 0;
      let isAutoPlaying = false;
      let autoPlayDirection = 1;

      window.addEventListener('scroll', function () {
        if (!isAutoPlaying) {
          const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
          targetScroll = maxScroll > 0 ? clamp(window.scrollY / maxScroll, 0, 1) : 0;
        }
      }, { passive: true });

      // --- Interactive Click to Enter Diary System ---
      const raycaster = new THREE.Raycaster();
      const mouseVec = new THREE.Vector2();

      function navigateToDiary() {
        document.body.style.transition = 'opacity 0.4s ease, filter 0.4s ease';
        document.body.style.opacity = '0';
        document.body.style.filter = 'blur(10px)';
        setTimeout(() => {
          window.location.href = 'diary.html';
        }, 380);
      }

      canvas.addEventListener('click', function (e) {
        const rect = canvas.getBoundingClientRect();
        mouseVec.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouseVec.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouseVec, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);
        if (intersects.length > 0) {
          navigateToDiary();
        }
      });

      window.addEventListener('mousemove', function (e) {
        const rect = canvas.getBoundingClientRect();
        mouseVec.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouseVec.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouseVec, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);
        canvas.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
      });

      diffTitleEl.addEventListener('click', navigateToDiary);



      // --- 7. Master Animation & Render Loop ---
      let lastTime = performance.now();
      let animFrameId = null;

      function tick(now) {
        const dt = clamp(now - lastTime, 0, 64);
        lastTime = now;

        // Auto Play Animation loop if active
        if (isAutoPlaying) {
          targetScroll += 0.004 * autoPlayDirection;
          if (targetScroll >= 1) {
            targetScroll = 1;
            autoPlayDirection = -1;
          } else if (targetScroll <= 0) {
            targetScroll = 0;
            autoPlayDirection = 1;
          }
          const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
          window.scrollTo(0, targetScroll * maxScroll);
        }

        // Smooth scroll decay
        const scrollFactor = 1 - Math.exp(-dt / 180);
        smoothScroll += (targetScroll - smoothScroll) * scrollFactor;
        if (Math.abs(targetScroll - smoothScroll) < 0.00008) {
          smoothScroll = targetScroll;
        }

        // Smooth mouse tracking
        smoothMouseX += (mouseX - smoothMouseX) * 0.08;
        smoothMouseY += (mouseY - smoothMouseY) * 0.08;

        // Section transition: scroll 8% -> 80%
        const rawTrans = clamp((smoothScroll - 0.08) / 0.72);
        const transition = easeInOutCubic(rawTrans);

        // A. Background Parallax: Accurately compute true rendered height so the bottom sea is 100% reached
        const naturalRatio = (landscapeImg.naturalHeight && landscapeImg.naturalWidth)
          ? (landscapeImg.naturalHeight / landscapeImg.naturalWidth)
          : (1024 / 576);
        const imgWidth = landscapeImg.getBoundingClientRect().width || window.innerWidth * 1.05;
        const trueRenderedHeight = Math.max(imgWidth * naturalRatio, window.innerHeight * 1.4);
        const maxShift = Math.max(0, trueRenderedHeight - window.innerHeight);

        const currentBgY = -maxShift * smoothScroll + smoothMouseY * 12;
        const currentBgX = smoothMouseX * -15;
        landscapeImg.style.transform = `translate3d(calc(-50% + ${currentBgX}px), ${currentBgY}px, 0)`;

        // B. Intro timing
        let introProgress = clamp((now - introStartTime) / 1350);

        // Continuous ambient floating wave
        const idleFloat = Math.sin(now * 0.002) * 14;
        const idleRotate = now * 0.0004;

        // C. Hero Title Letter Animations
        const nHero = heroSpans.length;
        heroSpans.forEach((span, i) => {
          const dir = i % 2 === 0 ? -1 : 1;

          // Enter animation (intro)
          const enterP = easeOutCubic(clamp((introProgress - i * 0.024) / 0.63));
          const initX = (1 - enterP) * (dir * 52 + 80);
          const initY = (1 - enterP) * -310;
          const initRotX = (1 - enterP) * 74;
          const initRotZ = (1 - enterP) * dir * 9;
          let opacity = enterP;

          // Leave animation (scroll scatter)
          const leaveP = easeInOutCubic(clamp((smoothScroll - 0.08 - i * 0.019) / 0.29));
          const scatterX = leaveP * ((i - (nHero - 1) / 2) * 39 + dir * 28);
          const scatterY = -430 * Math.pow(leaveP, 1.8);
          const scatterRotX = -leaveP * 24;
          const scatterRotZ = leaveP * dir * (17 + i * 1.7);

          const fadeOut = 1 - clamp((leaveP - 0.58) / 0.42);
          opacity *= fadeOut;

          // Mouse reactive parallax on titles
          const mouseTiltX = smoothMouseX * (i - nHero / 2) * 1.2;
          const mouseTiltY = smoothMouseY * 6;

          const finalX = initX + scatterX + mouseTiltX;
          const finalY = initY + scatterY + mouseTiltY;
          const finalRotX = initRotX + scatterRotX + smoothMouseY * -8;
          const finalRotZ = initRotZ + scatterRotZ + smoothMouseX * 4;

          span.style.transform = `translate3d(${finalX}px, ${finalY}px, 0) rotateX(${finalRotX}deg) rotateZ(${finalRotZ}deg)`;
          span.style.opacity = opacity;
        });

        // D. "The Difference" Title Letter Animations
        const nDiff = diffSpans.length;
        diffSpans.forEach((span, i) => {
          const enterP = easeOutBack(clamp((smoothScroll - 0.27 - i * 0.006) / 0.22));
          const startY = (1 - enterP) * 250;
          const startX = (1 - enterP) * ((i - nDiff / 2) * 9);
          const rotX = (1 - enterP) * -66;
          const rotZ = (i % 2 === 0 ? -1 : 1) * 5 * (1 - enterP);

          const opacity = clamp((smoothScroll - 0.27 - i * 0.005) / 0.13);

          span.style.transform = `translate3d(${startX}px, ${startY}px, 0) rotateX(${rotX}deg) rotateZ(${rotZ}deg)`;
          span.style.opacity = opacity;
        });

        // E. Cookie / Moon 3D Transformation & Dynamic Motion
        const cookieIntro = easeOutBack(clamp((introProgress - 0.22) / 0.72));

        // Position
        const targetHeroX = 0;
        const targetHeroY = layoutState.heroY;
        const curHeroX = lerp(155, targetHeroX, cookieIntro);
        const curHeroY = lerp(430, targetHeroY, cookieIntro);

        let finalCookieY = lerp(curHeroY, layoutState.sectionY, transition) + Math.sin(transition * Math.PI) * 9 + idleFloat;
        let finalCookieX = curHeroX + Math.sin(transition * Math.PI) * -20 + smoothMouseX * 18;

        // Scale
        const curHeroScale = lerp(0.18, layoutState.heroScale, cookieIntro);
        const finalCookieScale = lerp(curHeroScale, layoutState.sectionScale * 0.96, transition);

        cookieGroup.position.set(finalCookieX, -finalCookieY, 0);
        cookieGroup.scale.set(finalCookieScale, finalCookieScale, finalCookieScale);

        // Dynamic 3D Rotation: Scroll Flip + Continuous Idle Spin + Mouse Tilt
        cookieGroup.rotation.y = transition * Math.PI + idleRotate + smoothMouseX * 0.35;
        cookieGroup.rotation.z = lerp(-0.09, 0.19, transition) + Math.sin(now * 0.0015) * 0.03;
        cookieGroup.rotation.x = Math.sin(now * 0.001) * 0.06 + smoothMouseY * -0.3;

        // Render Three.js scene
        renderer.render(scene, camera);

        animFrameId = requestAnimationFrame(tick);
      }

      animFrameId = requestAnimationFrame(tick);

      window.addEventListener('pagehide', () => {
        if (animFrameId) cancelAnimationFrame(animFrameId);
      });
  </script>
</body>
</html>
