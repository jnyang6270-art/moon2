<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0d172e">
  <title>三分 — 你的解籤日記</title>

  <!-- Google Fonts for Chinese Display Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">

  <!-- Three.js + GLTFLoader (Modern ES Modules & Import Map for r160) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    @font-face {
      font-family: 'Suisse Fallback';
      src: local('Inter Medium'), local('Inter-Medium');
      font-weight: 500;
      font-display: swap;
    }

    :root {
      --desktop-scale: 1;
      --header-scale: 1;
      --tablet-layout: 0;
      --mobile-layout: 0;
      --hero-background-crop: 0.115;
      --final-background-crop: 0.303;
      --sky-blue: #0d172e;
      --section-cookie-radius: 266px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--sky-blue);
      color: #ffffff;
      font-family: 'Noto Serif TC', serif;
      overflow-x: hidden;
    }

    .experience {
      position: relative;
      width: 100%;
      height: 320vh;
      background: #02040a;
    }

    .viewport {
      position: sticky;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .landscape {
      position: absolute;
      left: 50%;
      top: 0;
      width: auto;
      height: 100%;
      min-width: 100vw;
      object-fit: cover;
      transform: translate3d(-50%, calc(var(--hero-background-crop) * -100%), 0);
      will-change: transform;
      filter: saturate(1.15) contrast(1.08) brightness(1.02);
    }

    .scene-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(2, 4, 10, 0.4) 100%);
      pointer-events: none;
    }

    .ambient-glow {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85vw;
      height: 85vh;
      max-width: 1100px;
      max-height: 1100px;
      background: radial-gradient(circle, rgba(230, 240, 255, 0.14) 0%, rgba(120, 180, 255, 0.05) 45%, transparent 75%);
      pointer-events: none;
      z-index: 2;
    }

    .scene-nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 110px;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-24px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .scene-nav.is-ready {
      opacity: 1;
      transform: translateY(0);
    }

    .brand-text {
      position: absolute;
      top: 38px;
      left: 48px;
      font-family: 'Noto Serif TC', 'Songti TC', serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.35em;
      color: rgba(255, 255, 255, 0.88);
      pointer-events: auto;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
      user-select: none;
    }

    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1726px;
      height: 1195px;
      transform: translate(-50%, -50%) scale(var(--desktop-scale));
      transform-origin: center center;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease-out;
    }

    .stage.is-ready {
      opacity: 1;
    }

    #cookie-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: auto;
      cursor: grab;
    }

    .title-container {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    .hero-title {
      top: 130px;
      left: 50%;
      transform: translateX(-50%);
      width: 1480px;
      height: 320px;
      font-family: 'Noto Serif TC', 'Songti TC', 'STSong', serif;
      font-weight: 900;
      font-size: 260px;
      line-height: 0.9;
      letter-spacing: 0.05em;
      text-indent: 0.05em;
      text-align: center;
      z-index: 4;
      text-shadow: 0 20px 70px rgba(0, 0, 0, 0.8), 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .diff-title {
      top: 1020px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 140px;
      font-family: 'Noto Serif TC', 'Songti TC', 'STSong', serif;
      font-weight: 900;
      font-size: 118px;
      line-height: 0.95;
      letter-spacing: 0.06em;
      text-indent: 0.06em;
      text-align: center;
      z-index: 4;
      text-shadow: 0 20px 70px rgba(0, 0, 0, 0.95), 0 4px 20px rgba(0, 0, 0, 0.7);
    }

    .split-char {
      display: inline-block;
      transform-origin: 50% 70%;
      will-change: transform, opacity;
      transition: color 0.3s ease;
    }

    .loading-hud {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #02040a;
      z-index: 1000;
      transition: opacity 0.6s ease;
    }

    .loading-spinner {
      width: 52px;
      height: 52px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffd1dc;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin-bottom: 20px;
    }

    .loading-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 14px;
      letter-spacing: 0.25em;
      color: rgba(255, 255, 255, 0.75);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 1060px) {
      :root { --tablet-layout: 1; }
      .hero-title {
        font-size: 240px;
        top: 120px;
        left: 50% !important;
        transform: translateX(-50%);
        width: 1200px;
        letter-spacing: 0.05em;
        text-indent: 0.05em;
      }
    }

    @media (max-width: 620px) {
      :root { --mobile-layout: 1; }
      .brand-text {
        top: 22px;
        left: 20px;
        font-size: 13px;
        letter-spacing: 0.25em;
      }
      .hero-title {
        left: 50% !important;
        transform: translateX(-50%);
        width: 100vw !important;
        font-size: 110px !important;
        letter-spacing: 0.05em !important;
        text-indent: 0.05em !important;
      }
      .diff-title {
        left: 50% !important;
        transform: translateX(-50%);
        width: 90% !important;
        font-size: 52px !important;
      }
    }
  </style>
</head>
<body>

  <!-- Loading HUD -->
  <div class="loading-hud" id="loading-hud">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="load-status">正在載入 3D 月相...</div>
  </div>

  <main class="experience">
    <div class="viewport">
      <div class="scene">
        <img class="landscape" id="landscape-img" src="https://cdn.jsdelivr.net/gh/jnyang6270-art/moon@main/background.jpg" alt="Starry Sky Sea Landscape">
        <div class="scene-vignette"></div>
        <div class="ambient-glow"></div>
      </div>

      <nav class="scene-nav" id="scene-nav">
        <div class="brand-text">天時。地利。人和</div>
      </nav>

      <div class="stage" id="stage">
        <canvas id="cookie-canvas"></canvas>
        <h1 class="title-container hero-title" id="hero-title">三分</h1>
        <h2 class="title-container diff-title" id="diff-title">你的解籤日記</h2>
      </div>
    </div>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    function clamp(val, min = 0, max = 1) { return Math.max(min, Math.min(max, val)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    function easeOutBack(t) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function splitTextToSpans(element) {
      const text = element.textContent.trim();
      element.innerHTML = '';
      const spans = [];
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const span = document.createElement('span');
        span.className = 'split-char';
        if (char === ' ') {
          span.innerHTML = '&nbsp;';
        } else {
          span.textContent = char;
        }
        element.appendChild(span);
        spans.push(span);
      }
      return spans;
    }

    const heroTitleEl = document.getElementById('hero-title');
    const diffTitleEl = document.getElementById('diff-title');
    const heroSpans = splitTextToSpans(heroTitleEl);
    const diffSpans = splitTextToSpans(diffTitleEl);

    const stageEl = document.getElementById('stage');
    const sceneNavEl = document.getElementById('scene-nav');
    const landscapeImg = document.getElementById('landscape-img');
    const canvas = document.getElementById('cookie-canvas');
    const loadingHud = document.getElementById('loading-hud');

    let layoutState = {
      w: window.innerWidth,
      h: window.innerHeight,
      scale: 1,
      headerScale: 1,
      isTablet: false,
      isMobile: false,
      heroY: 0,
      sectionY: 0,
      heroScale: 1,
      sectionScale: 1,
      bgHeight: 1280
    };

    function updateLayout() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const isTablet = w <= 1060;
      const isMobile = w <= 620;

      let scale = isMobile ? Math.max(w / 1726, h / 1195) : Math.min(w / 1726, h / 1195);
      let headerScale = isTablet ? clamp(w / 900, 0.82, 1) : Math.min(1, w / 1726);

      document.documentElement.style.setProperty('--desktop-scale', scale);
      document.documentElement.style.setProperty('--header-scale', headerScale);

      const targetDiameter = 532;
      let heroScale = 1;
      let sectionScale = 1;
      let heroY = 0;
      let sectionY = 0;

      if (isMobile) {
        const heroD = clamp(w * 0.72, 250, 310);
        const secD = clamp(w * 0.67, 235, 300);
        heroScale = heroD / targetDiameter;
        sectionScale = secD / targetDiameter;
        heroY = 50;
        sectionY = (h * 0.445 - h / 2) / scale;
      } else if (isTablet) {
        const heroD = clamp(w * 0.38, 260, 340);
        heroScale = heroD / targetDiameter;
        sectionScale = heroScale;
        heroY = 20;
        sectionY = 0;
      } else {
        const corridorCenter = (409 + 937) / 2;
        heroY = 1195 / 2 - corridorCenter;
        sectionY = 0;
        heroScale = 1;
        sectionScale = 1;
      }

      layoutState = {
        w, h, scale, headerScale, isTablet, isMobile,
        heroY, sectionY, heroScale, sectionScale,
        bgHeight: landscapeImg.clientHeight || 1280
      };
    }

    updateLayout();
    window.addEventListener('resize', updateLayout);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1726 / 2, 1726 / 2, 1195 / 2, -1195 / 2, -2000, 2000);
    camera.position.z = 1000;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(1726, 1195);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const ambientLight = new THREE.AmbientLight(0xfff6ea, 1.4);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e6, 2.5);
    sunLight.position.set(400, 800, 700);
    scene.add(sunLight);

    const rimLight = new THREE.DirectionalLight(0xa5c9ff, 1.8);
    rimLight.position.set(-500, -300, -400);
    scene.add(rimLight);

    const topGlow = new THREE.PointLight(0xffeacc, 1.6, 1600);
    topGlow.position.set(0, 450, 400);
    scene.add(topGlow);

    const cookieGroup = new THREE.Group();
    const innerGroup = new THREE.Group();
    cookieGroup.add(innerGroup);
    scene.add(cookieGroup);

    let moonModel = null;
    let introStartTime = 0;
    const loader = new GLTFLoader();

    function applyGltfModel(gltf) {
      const model = gltf.scene;
      moonModel = model;

      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      const targetSize = 532;
      const baseScale = targetSize / maxDim;

      const center = new THREE.Vector3();
      box.getCenter(center);
      model.position.sub(center);

      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach(mat => {
            if (mat) {
              if (mat.roughness !== undefined) mat.roughness = 0.55;
              if (mat.metalness !== undefined) mat.metalness = 0.05;
              if (mat.envMapIntensity !== undefined) mat.envMapIntensity = 1.2;
            }
            mat.needsUpdate = true;
          });
        }
      });

      innerGroup.scale.set(baseScale, baseScale, baseScale);
      innerGroup.add(model);

      if (loadingHud) {
        loadingHud.style.opacity = '0';
        setTimeout(() => loadingHud.remove(), 400);
      }
      introStartTime = performance.now();
      stageEl.classList.add('is-ready');
      sceneNavEl.classList.add('is-ready');
    }

    // Direct GitHub Pages 3D model endpoint with Access-Control-Allow-Origin: *
    const liveModelUrl = 'https://jnyang6270-art.github.io/moon/Hi3D-moon.glb';

    loader.load(
      liveModelUrl,
      applyGltfModel,
      function (xhr) {
        if (xhr.lengthComputable && xhr.total > 0) {
          const pct = Math.round((xhr.loaded / xhr.total) * 100);
          const statusEl = document.getElementById('load-status');
          if (statusEl) statusEl.textContent = `正在載入 3D 月相 (${pct}%)...`;
        }
      },
      function (err) {
        console.warn('GitHub Pages load failed, trying local file...', err);
        loader.load('Hi3D-moon.glb', applyGltfModel);
      }
    );

    let targetScroll = 0;
    let smoothScroll = 0;
    let mouseX = 0, mouseY = 0;
    let smoothMouseX = 0, smoothMouseY = 0;

    window.addEventListener('scroll', function () {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      targetScroll = maxScroll > 0 ? clamp(window.scrollY / maxScroll, 0, 1) : 0;
    }, { passive: true });

    window.addEventListener('mousemove', function (e) {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    let lastTime = performance.now();
    function tick(now) {
      const dt = clamp(now - lastTime, 0, 64);
      lastTime = now;

      smoothScroll = lerp(smoothScroll, targetScroll, 0.09);
      smoothMouseX = lerp(smoothMouseX, mouseX, 0.05);
      smoothMouseY = lerp(smoothMouseY, mouseY, 0.05);

      const introProgress = introStartTime > 0 ? clamp((now - introStartTime) / 1600) : 0;

      const bgCrop = lerp(0.115, 0.303, smoothScroll);
      landscapeImg.style.transform = `translate3d(-50%, calc(${bgCrop} * -100%), 0) scale(${1 + smoothScroll * 0.05})`;

      const transition = clamp((smoothScroll - 0.12) / 0.56);
      const idleFloat = Math.sin(now * 0.0018) * 8;

      const nHero = heroSpans.length;
      heroSpans.forEach((span, i) => {
        const dir = i < nHero / 2 ? -1 : 1;
        const enterP = easeOutCubic(clamp((introProgress - i * 0.024) / 0.63));
        const initX = (1 - enterP) * (dir * 52 + 80);
        const initY = (1 - enterP) * -310;
        const initRotX = (1 - enterP) * 74;
        const initRotZ = (1 - enterP) * dir * 9;
        let opacity = enterP;

        const leaveP = easeInOutCubic(clamp((smoothScroll - 0.08 - i * 0.019) / 0.29));
        const scatterX = leaveP * ((i - (nHero - 1) / 2) * 39 + dir * 28);
        const scatterY = -430 * Math.pow(leaveP, 1.8);
        const scatterRotX = -leaveP * 24;
        const scatterRotZ = leaveP * dir * (17 + i * 1.7);

        const fadeOut = 1 - clamp((leaveP - 0.58) / 0.42);
        opacity *= fadeOut;

        const mouseTiltX = smoothMouseX * (i - nHero / 2) * 1.2;
        const mouseTiltY = smoothMouseY * 6;

        span.style.transform = `translate3d(${initX + scatterX + mouseTiltX}px, ${initY + scatterY + mouseTiltY}px, 0) rotateX(${initRotX + scatterRotX + smoothMouseY * -8}deg) rotateZ(${initRotZ + scatterRotZ + smoothMouseX * 4}deg)`;
        span.style.opacity = opacity;
      });

      const nDiff = diffSpans.length;
      diffSpans.forEach((span, i) => {
        const enterP = easeOutBack(clamp((smoothScroll - 0.27 - i * 0.006) / 0.22));
        const startY = (1 - enterP) * 250;
        const startX = (1 - enterP) * ((i - nDiff / 2) * 9);
        const rotX = (1 - enterP) * -66;
        const rotZ = (i % 2 === 0 ? -1 : 1) * 5 * (1 - enterP);
        const opacity = clamp((smoothScroll - 0.27 - i * 0.005) / 0.13);

        span.style.transform = `translate3d(${startX}px, ${startY}px, 0) rotateX(${rotX}deg) rotateZ(${rotZ}deg)`;
        span.style.opacity = opacity;
      });

      const cookieIntro = easeOutBack(clamp((introProgress - 0.22) / 0.72));
      const targetHeroX = 0;
      const targetHeroY = layoutState.heroY;
      const curHeroX = lerp(155, targetHeroX, cookieIntro);
      const curHeroY = lerp(430, targetHeroY, cookieIntro);

      let finalCookieY = lerp(curHeroY, layoutState.sectionY, transition) + Math.sin(transition * Math.PI) * 9 + idleFloat;
      let finalCookieX = curHeroX + Math.sin(transition * Math.PI) * -20 + smoothMouseX * 18;

      const curHeroScale = lerp(0.18, layoutState.heroScale, cookieIntro);
      const finalCookieScale = lerp(curHeroScale, layoutState.sectionScale * 0.96, transition);

      cookieGroup.position.set(finalCookieX, finalCookieY, 0);
      cookieGroup.scale.set(finalCookieScale, finalCookieScale, finalCookieScale);

      const spinP = easeInOutCubic(transition);
      const spinAngleY = spinP * Math.PI * 2.2;
      const spinAngleX = Math.sin(spinP * Math.PI) * 0.35;

      innerGroup.rotation.y = now * 0.00032 + spinAngleY + smoothMouseX * 0.35;
      innerGroup.rotation.x = Math.sin(now * 0.0002) * 0.1 + spinAngleX + smoothMouseY * -0.25;

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
